name: Tobii
description: >-
  Tobii is the global leader in eye tracking and attention computing,
  headquartered in Danderyd, Sweden and listed on Nasdaq Stockholm. Its
  developer offering centers on the Tobii Pro SDK — Python (tobii-research),
  .NET, C and Matlab bindings for streaming gaze and eye-tracking data from
  Tobii's screen-based and wearable eye trackers — together with the Tobii Pro
  Glasses 3 API (with official g3pylib Python and .NET client SDKs) and XR /
  consumer game-integration developer kits. Tobii's technology serves
  scientific and behavioral research, UX, healthcare, XR/VR, automotive driver
  monitoring and PC gaming markets.
